name: Linux build and test

on:
  workflow_dispatch:
  push:
    branches: [linux]

jobs:
  build:
    # Built on the older Ubuntu so it also runs on 22.04 and newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-pip xvfb
          python3 -m pip install --user pyinstaller pillow
      - name: Build and package
        run: VERSION=3.3 bash build_linux.sh
      - name: Check the packaged app starts
        run: |
          mkdir smoke
          tar -xzf HarrySpotter-3.3-Linux-x86_64.tar.gz -C smoke
          cd smoke/HarrySpotter-3.3
          ls
          xvfb-run -a -s "-screen 0 1400x1000x24" bash -c \
            './HarrySpotter > run.log 2>&1 & PID=$!; sleep 12;
             if kill -0 $PID 2>/dev/null; then echo "APP RUNNING"; kill $PID;
             else echo "APP EXITED"; cat run.log; exit 1; fi'
          test -d input/mtz && echo "project folder created next to the app"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-app
          path: HarrySpotter-3.3-Linux-x86_64.tar.gz

  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - name: Install a virtual display and screenshot tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb imagemagick libgl1-mesa-dri mesa-utils
      # Ubuntu no longer packages Coot; conda-forge has Coot 1, PyMOL and gemmi.
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: hs
          create-args: >-
            python=3.12 tk pillow numpy gemmi coot pymol-open-source
          init-shell: bash
      - name: Show versions
        run: |
          which coot pymol gemmi python
          coot --version | head -2 || true
      - name: Make test data (public PDB 1CBS)
        run: python ci/make_test_data.py testdata
      - name: Run tests
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1600x1200x24" python ci/linux_tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-test-results
          path: ci-out
